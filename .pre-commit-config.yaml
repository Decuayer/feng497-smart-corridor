# Local hooks only (tools come from the active virtual environment, no downloads).
# Setup: pip install -r ai/requirements-dev.txt && pre-commit install
# Legacy prototypes are kept unchanged (see ai/README.md, Known issues).
exclude: ^(ai/prototype|edge/prototypes)/
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + import order)
        entry: ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: black
        name: black (format)
        entry: black --force-exclude
        language: system
        types: [python]
      - id: large-files
        name: no tracked file > 2 MB (gzipped SUMO nets exempt)
        entry: scripts/check_large_files.sh
        language: system
        pass_filenames: false
      - id: contracts
        name: validate shared/contracts
        entry: python scripts/validate_contracts.py
        language: system
        pass_filenames: false
        files: ^shared/contracts/
      - id: ai-unit-tests
        name: ai unit tests (no SUMO)
        entry: bash -c 'cd ai && python -m pytest tests -m "not sumo" -q -p no:cacheprovider'
        language: system
        pass_filenames: false
        files: ^(ai/|shared/contracts/)
