# Independent PPO with parameter sharing (IPPO-PS). Merged on top of base.yaml.
name: ppo_ippo
sim:
  horizon_s: 1800
ppo:
  episodes: 20
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  epochs: 4
  minibatch_size: 256
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [128, 128]
  device: cpu
  train_scale_min: 0.8
  train_scale_max: 1.3
  eval_every: 5
  eval_seed: 999
  checkpoint_every: 10
