# Parameter-shared independent Double DQN. Merged on top of base.yaml.
name: dqn
algo: dqn
sim:
  horizon_s: 1800
dqn:
  episodes: 100
  learning_rate: 0.0005
  gamma: 0.99
  buffer_size: 200000
  batch_size: 256
  learning_starts: 5000
  train_every: 1
  gradient_steps: 2
  target_tau: 0.005
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_fraction: 0.4
  hidden_sizes: [128, 128]
  max_grad_norm: 10.0
  device: cpu
  train_scale_min: 0.8
  train_scale_max: 1.3
  eval_every: 10
  eval_seed: 999
  checkpoint_every: 25
